# lynx.cfg - Lynx configuration for ZealOS
# Part of the ZealOS POSIX compatibility layer

# =============================================================================
# CHARACTER SET
# =============================================================================

# Default character set for display
CHARACTER_SET:utf-8

# Assume documents are in this character set if not specified
ASSUME_CHARSET:iso-8859-1

# Preferred language for documents
PREFERRED_LANGUAGE:en

# =============================================================================
# STARTUP FILES
# =============================================================================

# Default start page
STARTFILE:file://localhost/Home/POSIX/share/lynx_help/index.html

# Help file location
HELPFILE:file://localhost/Home/POSIX/share/lynx_help/lynx_help_main.html

# Global bookmarks file
DEFAULT_BOOKMARK_FILE:/Home/POSIX/var/lynx_bookmarks.html

# =============================================================================
# FILE PATHS
# =============================================================================

# MIME types file
GLOBAL_EXTENSION_MAP:/Home/POSIX/etc/mime.types

# Mailcap file for external viewers
GLOBAL_MAILCAP:/Home/POSIX/etc/mailcap

# Temporary file location
TEMP_SPACE:/tmp/

# =============================================================================
# NETWORK SETTINGS
# =============================================================================

# Use ZealOS native HTTP/TLS stack where possible
# For external URLs, use standard HTTP client

# Default ports
HTTP_PORT:80
HTTPS_PORT:443

# Connection timeout in seconds
CONNECT_TIMEOUT:30

# Read timeout in seconds
READ_TIMEOUT:60

# Maximum redirects to follow
MAX_REDIRECTS:10

# =============================================================================
# DISPLAY SETTINGS
# =============================================================================

# Use color if available
COLOR_STYLE:lynx

# Default colors (when not using style sheets)
# Format: FOREGROUND:BACKGROUND:ATTRIBUTE

# Normal text
COLOR:0:normal:white:black

# Bold text
COLOR:1:bold:brightwhite:black:bold

# Underline/emphasis
COLOR:2:underline:brightblue:black:underline

# Reverse video (status line, etc.)
COLOR:3:reverse:black:white:reverse

# Link colors
COLOR:4:anchor:brightcyan:black
COLOR:5:anchor+visited:magenta:black

# Form input fields
COLOR:6:form_input:black:cyan

# Alert/error messages
COLOR:7:alert:brightred:black:bold

# =============================================================================
# USER INTERFACE
# =============================================================================

# Show cursor on current link (helpful for accessibility)
SHOW_CURSOR:TRUE

# Use scrollbar when available
USE_SCROLLBAR:TRUE

# Enable mouse support (if curses supports it)
USE_MOUSE:FALSE

# Keypad mode - allow arrow keys for navigation
KEYPAD_MODE:NUMBERS_AS_ARROWS

# Number of lines to keep for context when scrolling
SCROLLBAR_CONTEXT:2

# =============================================================================
# COOKIES
# =============================================================================

# Accept cookies
SET_COOKIES:TRUE

# Store cookies between sessions
PERSISTENT_COOKIES:TRUE

# Cookie file location
COOKIE_FILE:/Home/POSIX/var/lynx_cookies

# Accept cookies from these domains without asking
COOKIE_ACCEPT_DOMAINS:

# Always reject cookies from these domains
COOKIE_REJECT_DOMAINS:

# =============================================================================
# SECURITY
# =============================================================================

# For ZealOS, we use our native TLS implementation
# SSL/TLS certificate checking (if using external SSL)
SSL_CERT_CHECK:FALSE

# Don't send Referer header (privacy)
NO_REFERER:FALSE

# =============================================================================
# CACHE
# =============================================================================

# Memory cache size (in documents)
CACHE_SIZE:20

# Enable source caching
SOURCE_CACHE:MEMORY

# =============================================================================
# EXTERNAL PROGRAMS
# =============================================================================

# Editor for forms and local file editing
DEFAULT_EDITOR:/Home/POSIX/bin/ed

# Mail program (if available)
SYSTEM_MAIL:

# Telnet program
TELNET_PROG:

# =============================================================================
# LYNX BEHAVIOR
# =============================================================================

# Don't exit on 'q' - require confirmation
QUIT_DEFAULT_YES:FALSE

# Default bookmark action
DEFAULT_BOOKMARK_SAVE:STANDARD

# Case-sensitive searching
CASE_SENSITIVE_SEARCHING:FALSE

# Visited links handling
VISITED_LINKS:LAST_REVERSE

# =============================================================================
# PROXY SETTINGS (if needed)
# =============================================================================

# HTTP proxy
#http_proxy:http://proxy.example.com:8080/

# HTTPS proxy
#https_proxy:http://proxy.example.com:8080/

# FTP proxy
#ftp_proxy:http://proxy.example.com:8080/

# No proxy for these domains
#no_proxy:localhost,127.0.0.1,.local

# =============================================================================
# MIME TYPE HANDLERS
# =============================================================================

# Define external viewers for different content types
# Format: VIEWER:content-type:command

# Images - display info only (no graphical viewer in text mode)
VIEWER:image/*:echo "Image: %s"

# PDF files
VIEWER:application/pdf:echo "PDF document: %s"

# Plain text (use internal viewer)
VIEWER:text/plain:

# HTML (use internal viewer)
VIEWER:text/html:

# =============================================================================
# SUFFIX MAPPINGS
# =============================================================================

# Map file extensions to MIME types
SUFFIX:.html:text/html
SUFFIX:.htm:text/html
SUFFIX:.txt:text/plain
SUFFIX:.text:text/plain
SUFFIX:.gif:image/gif
SUFFIX:.jpg:image/jpeg
SUFFIX:.jpeg:image/jpeg
SUFFIX:.png:image/png
SUFFIX:.css:text/css
SUFFIX:.js:application/javascript
SUFFIX:.json:application/json
SUFFIX:.xml:text/xml
SUFFIX:.pdf:application/pdf
SUFFIX:.zip:application/zip
SUFFIX:.tar:application/x-tar
SUFFIX:.gz:application/gzip

# =============================================================================
# END OF CONFIGURATION
# =============================================================================
